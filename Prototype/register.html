<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration - TIP MDS EMR</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/register.css">
</head>
<body>
    <div class="register-container">
        <div class="header">
            <div class="logo-icon">
                <i class="fas fa-heartbeat"></i>
            </div>
            <h1>Student Registration</h1>
            <p class="subtitle">Create your TIP MDS EMR account</p>
        </div>

        <form id="registerForm">
            <h3 class="section-title">Account Information</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Email <span class="required">*</span></label>
                    <input type="email" name="email" placeholder="student@tip.edu.ph" required>
                </div>
                <div class="form-group">
                    <label>Password <span class="required">*</span></label>
                    <input type="password" name="password" placeholder="Enter password" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Confirm Password <span class="required">*</span></label>
                    <input type="password" name="confirmPassword" placeholder="Re-enter password" required>
                </div>
            </div>

            <h3 class="section-title">Personal Information</h3>
            <div class="form-row">
                <div class="form-group">
                    <label>Student ID <span class="required">*</span></label>
                    <input type="text" name="studentId" placeholder="e.g., 2310346" required>
                </div>
                <div class="form-group">
                    <label>Program <span class="required">*</span></label>
                    <select name="program" required>
                        <option value="">Select Program</option>
                        <option>Computer Science</option>
                        <option>Information Technology</option>
                        <option>Engineering</option>
                        <option>Business Administration</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Last Name <span class="required">*</span></label>
                    <input type="text" name="lastName" placeholder="Enter last name" required>
                </div>
                <div class="form-group">
                    <label>First Name <span class="required">*</span></label>
                    <input type="text" name="firstName" placeholder="Enter first name" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Middle Name <span class="required">*</span></label>
                    <input type="text" name="middleName" placeholder="Enter middle name" required>
                </div>
            </div>

            <div class="button-group">
                <button type="submit" class="btn-primary">
                    <i class="fas fa-user-plus"></i> Create Account
                </button>
                <button type="reset" class="btn-secondary">
                    <i class="fas fa-redo"></i> Reset
                </button>
            </div>
        </form>

        <div class="back-link">
            <p><a href="index.html"><i class="fas fa-arrow-left"></i> Back to Login</a></p>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const formData = new FormData(e.target);
            const password = formData.get('password');
            const confirmPassword = formData.get('confirmPassword');
            
            // Check if passwords match
            if (password !== confirmPassword) {
                alert('Passwords do not match!');
                return;
            }
            
            // Here you would normally send data to backend
            console.log('Registration data:', Object.fromEntries(formData));
            alert('Registration successful! Please wait for admin approval. You will receive an email notification.');
            
            // Redirect to login page
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 2000);
        });
    </script>
</body>
</html>
