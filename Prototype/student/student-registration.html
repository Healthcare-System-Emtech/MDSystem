<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Student Registration - TIP MDS EMR</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="dashboard active">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <i class="fas fa-heartbeat"></i>
                    </div>
                    <div class="sidebar-logo-text">
                        <h2>TIP MDS EMR</h2>
                        <p>Student Portal</p>
                    </div>
                </div>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a class="nav-link" href="student-dashboard.html">
                        <i class="fas fa-home"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="student-registration.html">
                        <i class="fas fa-file-medical"></i>
                        <span>New Student Form</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="student-update.html">
                        <i class="fas fa-edit"></i>
                        <span>Update Information</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="student-appointments.html">
                        <i class="fas fa-calendar-check"></i>
                        <span>Appointments</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="student-records.html">
                        <i class="fas fa-folder-open"></i>
                        <span>My Records</span>
                    </a>
                </li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <h1 class="page-title">New Student Registration</h1>
                <div class="top-bar-right">
                    <span class="date-display">Saturday, October 18, 2025</span>
                    <button class="logout-btn" onclick="handleLogout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>

            <div class="form-container">
                <h3><i class="fas fa-user-plus"></i> New Student Registration Form</h3>
                <form id="registrationForm">
                    <h4 style="margin: 20px 0 15px; color: #667eea;">Personal Information</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Student ID</label>
                            <input type="text" name="studentId" placeholder="e.g., 2020101" required>
                        </div>
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" name="fullName" placeholder="Enter full name" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Program</label>
                            <select name="program" required>
                                <option value="">Select Program</option>
                                <option>Computer Engineering</option>
                                <option>Information Technology</option>
                                <option>Civil Engineering</option>
                                <option>Business Administration</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Year Level</label>
                            <select name="yearLevel" required>
                                <option value="">Select Year</option>
                                <option>1st Year</option>
                                <option>2nd Year</option>
                                <option>3rd Year</option>
                                <option>4th Year</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Birthdate</label>
                            <input type="date" name="birthdate" required>
                        </div>
                        <div class="form-group">
                            <label>Sex</label>
                            <select name="sex" required>
                                <option value="">Select</option>
                                <option>Male</option>
                                <option>Female</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Contact Number</label>
                            <input type="tel" name="contact" placeholder="+63 XXX XXX XXXX" required>
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" placeholder="student@tip.edu.ph" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Address</label>
                        <textarea name="address" rows="3" placeholder="Complete address" required></textarea>
                    </div>

                    <h4 style="margin: 30px 0 15px; color: #667eea;">Emergency Contact</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Emergency Contact Name</label>
                            <input type="text" name="emergencyName" required>
                        </div>
                        <div class="form-group">
                            <label>Relationship</label>
                            <input type="text" name="relationship" placeholder="e.g., Parent, Guardian" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Emergency Contact Number</label>
                            <input type="tel" name="emergencyContact" required>
                        </div>
                        <div class="form-group">
                            <label>Emergency Contact Address</label>
                            <input type="text" name="emergencyAddress" required>
                        </div>
                    </div>

                    <h4 style="margin: 30px 0 15px; color: #667eea;">Medical Information</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Height (cm)</label>
                            <input type="number" name="height" step="0.1" placeholder="e.g., 170.5">
                        </div>
                        <div class="form-group">
                            <label>Weight (kg)</label>
                            <input type="number" name="weight" step="0.1" placeholder="e.g., 65.0">
                        </div>
                        <div class="form-group">
                            <label>Blood Type</label>
                            <select name="bloodType">
                                <option value="">Select</option>
                                <option>A+</option>
                                <option>A-</option>
                                <option>B+</option>
                                <option>B-</option>
                                <option>AB+</option>
                                <option>AB-</option>
                                <option>O+</option>
                                <option>O-</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Known Allergies</label>
                        <textarea name="allergies" rows="3" placeholder="List any known allergies"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Current Medications</label>
                        <textarea name="medications" rows="3" placeholder="List current medications"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Immunization History</label>
                        <textarea name="immunization" rows="3" placeholder="List vaccines received"></textarea>
                    </div>

                    <h4 style="margin: 30px 0 15px; color: #667eea;">Dental Information</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Last Dental Visit</label>
                            <input type="date" name="lastDentalVisit">
                        </div>
                        <div class="form-group">
                            <label>Oral Habits</label>
                            <input type="text" name="oralHabits" placeholder="e.g., Teeth grinding">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Dental History</label>
                        <textarea name="dentalHistory" rows="3" placeholder="Previous dental procedures, concerns"></textarea>
                    </div>

                    <div style="margin-top: 30px;">
                        <button type="submit" class="btn-primary" style="width: auto; padding: 12px 40px;">
                            <i class="fas fa-paper-plane"></i> Submit Registration
                        </button>
                        <button type="reset" class="btn-secondary">
                            <i class="fas fa-redo"></i> Reset Form
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="js/student-forms.js"></script>
    <script>
        protectPage();
    </script>
</body>
</html>
