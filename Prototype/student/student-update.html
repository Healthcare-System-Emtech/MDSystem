<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Information - TIP MDS EMR</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/forms.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
    <div class="dashboard active">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo">
                    <div class="sidebar-logo-icon">
                        <i class="fas fa-heartbeat"></i>
                    </div>
                    <div class="sidebar-logo-text">
                        <h2>TIP MDS EMR</h2>
                        <p>Student Portal</p>
                    </div>
                </div>
            </div>

            <ul class="nav-menu">
                <li class="nav-item">
                    <a class="nav-link" href="student-dashboard.html">
                        <i class="fas fa-home"></i>
                        <span>Dashboard</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="student-registration.html">
                        <i class="fas fa-file-medical"></i>
                        <span>New Student Form</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link active" href="student-update.html">
                        <i class="fas fa-edit"></i>
                        <span>Update Information</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="student-appointments.html">
                        <i class="fas fa-calendar-check"></i>
                        <span>Appointments</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="student-records.html">
                        <i class="fas fa-folder-open"></i>
                        <span>My Records</span>
                    </a>
                </li>
            </ul>
        </aside>

        <main class="main-content">
            <div class="top-bar">
                <h1 class="page-title">Update Information</h1>
                <div class="top-bar-right">
                    <span class="date-display">Saturday, October 18, 2025</span>
                    <button class="logout-btn" onclick="handleLogout()">
                        <i class="fas fa-sign-out-alt"></i> Logout
                    </button>
                </div>
            </div>

            <div class="form-container">
                <h3><i class="fas fa-edit"></i> Update Student Information</h3>
                <form id="updateForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label>Student ID (Read-only)</label>
                            <input type="text" value="2020101" readonly style="background: #f0f0f0;">
                        </div>
                        <div class="form-group">
                            <label>Full Name (Read-only)</label>
                            <input type="text" value="Juan Dela Cruz" readonly style="background: #f0f0f0;">
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Contact Number</label>
                            <input type="tel" name="contact" value="+63 912 345 6789">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" name="email" value="juan.delacruz@tip.edu.ph">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Current Address</label>
                        <textarea name="address" rows="3">123 Main Street, Quezon City, Metro Manila</textarea>
                    </div>

                    <h4 style="margin: 30px 0 15px; color: #667eea;">Emergency Contact Update</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Emergency Contact Name</label>
                            <input type="text" name="emergencyName" value="Maria Dela Cruz">
                        </div>
                        <div class="form-group">
                            <label>Emergency Contact Number</label>
                            <input type="tel" name="emergencyContact" value="+63 917 123 4567">
                        </div>
                    </div>

                    <h4 style="margin: 30px 0 15px; color: #667eea;">Medical Updates</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Current Height (cm)</label>
                            <input type="number" name="height" step="0.1" value="172.5">
                        </div>
                        <div class="form-group">
                            <label>Current Weight (kg)</label>
                            <input type="number" name="weight" step="0.1" value="68.0">
                        </div>
                    </div>

                    <div class="form-group">
                        <label>New Allergies (if any)</label>
                        <textarea name="newAllergies" rows="3" placeholder="Add any newly discovered allergies"></textarea>
                    </div>

                    <div class="form-group">
                        <label>New Medications</label>
                        <textarea name="newMedications" rows="3" placeholder="Add any new medications"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Recent Diagnosis/Conditions</label>
                        <textarea name="recentDiagnosis" rows="3" placeholder="Describe any recent medical conditions"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Supporting Documents</label>
                        <input type="file" name="documents" multiple>
                    </div>

                    <h4 style="margin: 30px 0 15px; color: #667eea;">Dental Updates</h4>
                    <div class="form-group">
                        <label>Recent Dental Visits/Procedures</label>
                        <textarea name="dentalProcedures" rows="3" placeholder="Describe recent dental procedures"></textarea>
                    </div>

                    <div class="form-group">
                        <label>Dental Concerns</label>
                        <textarea name="dentalConcerns" rows="3" placeholder="Any dental concerns or issues"></textarea>
                    </div>

                    <div class="form-group">
                        <label style="display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" required>
                            <span>I declare that all information provided is accurate and complete</span>
                        </label>
                    </div>

                    <div style="margin-top: 30px;">
                        <button type="submit" class="btn-primary" style="width: auto; padding: 12px 40px;">
                            <i class="fas fa-check"></i> Submit Update
                        </button>
                        <button type="button" class="btn-secondary" onclick="navigateTo('student-dashboard.html')">
                            <i class="fas fa-times"></i> Cancel
                        </button>
                    </div>
                </form>
            </div>
        </main>
    </div>

    <script src="../js/utils.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="js/student-forms.js"></script>
    <script>
        protectPage();
    </script>
</body>
</html>
